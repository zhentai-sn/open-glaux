name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/landing/**"
      - "scripts/release/install.sh"
      - "scripts/release/install.ps1"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare site and latest manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R docs/landing/. _site/
          cp scripts/release/install.sh scripts/release/install.ps1 _site/
          if [ -n "$RELEASE_TAG" ]; then
            tag="$RELEASE_TAG"
          else
            tag=$(gh api "repos/$REPOSITORY/releases" --jq '[.[] | select(.draft == false and .prerelease == false) | select(any(.assets[]; .name == "SHA256SUMS"))][0].tag_name // empty')
          fi
          if [ -n "$tag" ]; then
            gh release download "$tag" --repo "$REPOSITORY" --pattern SHA256SUMS --dir "$RUNNER_TEMP"
            setup=$(gh api "repos/$REPOSITORY/releases/tags/$tag" --jq 'any(.assets[]; .name == "WINDOWS-SHA256SUMS")')
            if [ "$setup" = true ]; then
              gh release download "$tag" --repo "$REPOSITORY" --pattern WINDOWS-SHA256SUMS --dir "$RUNNER_TEMP"
            fi
            python - "$tag" "$RUNNER_TEMP/SHA256SUMS" "_site/latest.json" "https://github.com/$REPOSITORY/releases/download/$tag" <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json, re, sys
          tag, sums_path, output, base = sys.argv[1:]
          if not re.fullmatch(r"v\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?", tag):
              raise SystemExit(f"invalid release tag: {tag}")
          version = tag[1:]
          sums = {}
          for line in Path(sums_path).read_text(encoding="utf-8").splitlines():
              match = re.fullmatch(r"([0-9a-f]{64})\s+glaux-" + re.escape(version) + r"\.(tar\.gz|zip)", line)
              if match:
                  sums[match.group(2)] = match.group(1)
          if set(sums) != {"tar.gz", "zip"}:
              raise SystemExit("SHA256SUMS must include tar.gz and zip packages")
          doc = {
              "version": version,
              "tag": tag,
              "published_at": datetime.now(timezone.utc).date().isoformat(),
              "assets": {
                  ext: {"url": f"{base}/glaux-{version}.{ext}", "sha256": digest}
                  for ext, digest in sums.items()
              },
          }
          windows_sums = Path(sums_path).with_name("WINDOWS-SHA256SUMS")
          if windows_sums.exists():
              match = re.fullmatch(r"([0-9a-f]{64})\s+Glaux-Setup\.exe\s*", windows_sums.read_text(encoding="utf-8"))
              if not match:
                  raise SystemExit("invalid Windows setup checksum")
              doc["assets"]["windows-setup"] = {"url": f"{base}/Glaux-Setup.exe", "sha256": match.group(1)}
          Path(output).write_text(json.dumps(doc, indent=2) + "\n", encoding="utf-8")
          PY
          else
            printf '{"version":null,"tag":null,"published_at":null,"assets":{}}\n' > _site/latest.json
          fi
      # 落地页的数据条：下载量与 Star 在部署时取好写进 stats.json，页面因此不需要任何统计脚本
      # （SDD 24 §7.9 第 5 条）。取数失败整条隐藏，不影响页面其余部分。
      - name: Collect repository stats
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime, json, os, urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]

          def get(url):
              req = urllib.request.Request(
                  url,
                  headers={"Authorization": f"Bearer {token}", "User-Agent": "glaux-pages"},
              )
              return json.load(urllib.request.urlopen(req, timeout=30))

          releases, page = [], 1
          while True:
              batch = get(f"https://api.github.com/repos/{repo}/releases?per_page=100&page={page}")
              if not batch:
                  break
              releases += batch
              if len(batch) < 100:
                  break
              page += 1

          published = [r for r in releases if not r.get("draft") and not r.get("prerelease")]
          stats = {
              "downloads": sum(a.get("download_count", 0) for r in published for a in r.get("assets", [])),
              "releases": len(published),
              "stars": get(f"https://api.github.com/repos/{repo}").get("stargazers_count", 0),
              "version": json.load(open("_site/latest.json", encoding="utf-8")).get("version"),
              "updated_at": datetime.datetime.now(datetime.timezone.utc).date().isoformat(),
          }
          with open("_site/stats.json", "w", encoding="utf-8") as fh:
              fh.write(json.dumps(stats, indent=2) + "\n")
          print(json.dumps(stats))
          PY
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
