name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, macos-15-intel, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            agent-runtime/package-lock.json
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            science-core/uv.lock
      - name: Install dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix agent-runtime
          uv sync --project backend --frozen --extra dev --extra video
          uv sync --project science-core --frozen --extra dev
      - name: Check literals and versions
        run: |
          bash scripts/ci/check-modality-literals.sh --strict
          python scripts/test_version_matrix.py
      - name: Test
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          npm --prefix agent-runtime test
          npm --prefix frontend test
          (cd backend && uv run --frozen pytest -q)
          (cd science-core && uv run --frozen pytest -q)
      - name: Lint and typecheck
        run: |
          (cd backend && uv run --frozen ruff check .)
          npm --prefix frontend run lint
          npm --prefix agent-runtime run lint
