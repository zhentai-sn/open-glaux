<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <title>Glaux Agent Loop · 模型—工具循环</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5f7fae"/>
    </marker>
    <style>
      .t { fill: #1f2a3d; font-size: 15px; font-weight: 700; }
      .d { fill: #4d586b; font-size: 12.5px; }
      .h { fill: #2f5f9e; font-size: 11.5px; font-family: 'JetBrains Mono', Consolas, monospace; }
      .lbl { fill: #1f2a3d; font-size: 12px; }
      .node { fill: #ffffff; stroke: #7a9cc9; stroke-width: 1.4; }
      .todo { stroke-dasharray: 6 4; }
      .flow { fill: none; stroke: #5f7fae; stroke-width: 1.8; marker-end: url(#arrow); }
      .tag { fill: #ffffff; stroke: #c3cfe0; }
    </style>
  </defs>

  <rect width="1280" height="900" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="640" y="48" text-anchor="middle" fill="#1f2a3d" font-size="30" font-weight="700">Glaux Agent Loop · 模型—工具循环</text>
  <text x="640" y="80" text-anchor="middle" class="d" font-size="14">组装上下文后反复「调用模型 → 执行工具 → 写回结果」，直到给出最终回答</text>
  <text x="640" y="110" text-anchor="middle" class="d" font-size="13">运行时框架：pi-agent-core（只负责循环、会话树、压缩与钩子分发）· Glaux 经插件契约挂接</text>

  <!-- 运行时面板 -->
  <rect x="24" y="130" width="1232" height="560" rx="12" fill="#f3f7fd" stroke="#9db6dc" stroke-width="1.4"/>
  <rect x="36" y="142" width="1208" height="30" rx="8" fill="#d6e4f7"/>
  <text x="640" y="163" text-anchor="middle" class="t">agent-runtime · 智能体运行时</text>

  <!-- ① 组装上下文 -->
  <rect x="40" y="184" width="292" height="494" rx="10" fill="none" stroke="#7a9cc9" stroke-dasharray="5 4"/>
  <text x="186" y="208" text-anchor="middle" class="t">① 组装上下文</text>
  <text x="186" y="226" text-anchor="middle" class="d">进入循环前组装一次</text>

  <rect x="52" y="236" width="268" height="78" rx="8" class="node"/>
  <text x="186" y="260" text-anchor="middle" class="t">指令</text>
  <text x="186" y="280" text-anchor="middle" class="d">基础身份段 · 插件提示词片段</text>
  <text x="186" y="299" text-anchor="middle" class="d">用户追加段 · 提示词模板（待做）</text>

  <rect x="52" y="324" width="268" height="78" rx="8" class="node todo"/>
  <text x="186" y="348" text-anchor="middle" class="t">能力（Skills）</text>
  <text x="186" y="368" text-anchor="middle" class="d">内置 / 用户级 / 项目级三层</text>
  <text x="186" y="387" text-anchor="middle" class="d">目录进提示词，正文按需 read</text>

  <rect x="52" y="412" width="268" height="78" rx="8" class="node"/>
  <text x="186" y="436" text-anchor="middle" class="t">工具定义（Tools）</text>
  <text x="186" y="456" text-anchor="middle" class="d">ToolProvider 按条件挂载</text>
  <text x="186" y="475" text-anchor="middle" class="d">effect 分级 · agent 子智能体（待做）</text>

  <rect x="52" y="500" width="268" height="78" rx="8" fill="#f4eef7" stroke="#b48dc2" stroke-width="1.4"/>
  <text x="186" y="524" text-anchor="middle" class="t">知识与记忆</text>
  <text x="186" y="544" text-anchor="middle" class="d">会话历史 · Atlas 图谱</text>
  <text x="186" y="563" text-anchor="middle" class="d">领域术语进 Skills · 跨会话记忆（后续）</text>

  <rect x="52" y="588" width="268" height="78" rx="8" class="node"/>
  <text x="186" y="612" text-anchor="middle" class="t">环境快照</text>
  <text x="186" y="632" text-anchor="middle" class="d">焦点 · 对象 · 项目</text>
  <text x="186" y="651" text-anchor="middle" class="d">目录标签，不是画面描述</text>

  <!-- 进入循环 -->
  <path d="M332 260 L493 260" class="flow"/>
  <rect x="372" y="238" width="80" height="20" rx="4" class="tag"/>
  <text x="412" y="252" text-anchor="middle" class="lbl">进入循环</text>

  <!-- 循环节点 -->
  <rect x="495" y="221" width="190" height="78" rx="8" class="node todo"/>
  <text x="590" y="245" text-anchor="middle" class="t">② 压缩检查</text>
  <text x="590" y="265" text-anchor="middle" class="d">接近窗口上限时压缩</text>
  <text x="590" y="285" text-anchor="middle" class="h">context · before_compact</text>

  <rect x="735" y="221" width="190" height="78" rx="8" class="node"/>
  <text x="830" y="245" text-anchor="middle" class="t">③ 调用模型</text>
  <text x="830" y="265" text-anchor="middle" class="d">生成回复或工具调用</text>
  <text x="830" y="285" text-anchor="middle" class="h">before_provider_payload</text>

  <rect x="835" y="391" width="190" height="78" rx="8" class="node"/>
  <text x="930" y="415" text-anchor="middle" class="t">④ 有工具调用？</text>
  <text x="930" y="435" text-anchor="middle" class="d">有 → 执行；无 → 结束</text>
  <text x="930" y="455" text-anchor="middle" class="h">循环内置</text>

  <rect x="735" y="561" width="190" height="78" rx="8" class="node todo"/>
  <text x="830" y="585" text-anchor="middle" class="t">⑤ 执行工具</text>
  <text x="830" y="605" text-anchor="middle" class="d">按名称与参数调用</text>
  <text x="830" y="625" text-anchor="middle" class="h">tool_call：权限·越界·预算</text>

  <rect x="495" y="561" width="190" height="78" rx="8" class="node todo"/>
  <text x="590" y="585" text-anchor="middle" class="t">⑥ 结果写回</text>
  <text x="590" y="605" text-anchor="middle" class="d">工具结果追加进上下文</text>
  <text x="590" y="625" text-anchor="middle" class="h">tool_result：校验·截断</text>

  <rect x="395" y="391" width="190" height="78" rx="8" class="node todo"/>
  <text x="490" y="415" text-anchor="middle" class="t">⑦ 暂停检查</text>
  <text x="490" y="435" text-anchor="middle" class="d">审批 · ask_user · 插话</text>
  <text x="490" y="455" text-anchor="middle" class="h">钩子内挂起 · steer</text>

  <!-- 循环箭头 -->
  <path d="M685 260 L733 260" class="flow"/>
  <path d="M880 299 Q930 330 930 389" class="flow"/>
  <path d="M930 469 Q930 530 882 559" class="flow"/>
  <path d="M735 600 L687 600" class="flow"/>
  <path d="M540 561 Q490 530 490 471" class="flow"/>
  <path d="M490 391 Q490 330 538 301" class="flow"/>
  <rect x="936" y="508" width="26" height="20" rx="4" class="tag"/>
  <text x="949" y="522" text-anchor="middle" class="lbl">有</text>
  <rect x="418" y="318" width="54" height="20" rx="4" class="tag"/>
  <text x="445" y="332" text-anchor="middle" class="lbl">下一轮</text>

  <text x="710" y="425" text-anchor="middle" fill="#2f5f9e" font-size="17" font-weight="700">↻ 每轮一次</text>
  <text x="710" y="448" text-anchor="middle" class="d">直到没有工具调用</text>

  <!-- ⑧ 最终回答 -->
  <path d="M1025 430 L1078 430" class="flow"/>
  <rect x="1038" y="406" width="26" height="20" rx="4" class="tag"/>
  <text x="1051" y="420" text-anchor="middle" class="lbl">无</text>
  <rect x="1080" y="391" width="160" height="78" rx="8" fill="#cfe0f7" stroke="#7a9cc9" stroke-width="1.4"/>
  <text x="1160" y="415" text-anchor="middle" class="t">⑧ 最终回答</text>
  <text x="1160" y="435" text-anchor="middle" class="d">结束本轮；预算用尽</text>
  <text x="1160" y="453" text-anchor="middle" class="d">也在此收尾</text>

  <!-- 模型层 -->
  <path d="M927 260 L1038 260" class="flow" marker-start="url(#arrow)"/>
  <rect x="944" y="238" width="78" height="20" rx="4" class="tag"/>
  <text x="983" y="252" text-anchor="middle" class="lbl">请求 / 响应</text>
  <rect x="1040" y="221" width="200" height="78" rx="8" fill="#ffffff" stroke="#7a9cc9" stroke-width="1.4"/>
  <text x="1140" y="245" text-anchor="middle" class="t">模型层</text>
  <text x="1140" y="265" text-anchor="middle" class="d">ModelRuntime · 连接探测</text>
  <text x="1140" y="284" text-anchor="middle" class="d">OpenAI 兼容 · Qwen 音视频</text>

  <!-- 数据访问层 -->
  <path d="M927 600 L1038 600" class="flow" marker-start="url(#arrow)"/>
  <rect x="944" y="578" width="78" height="20" rx="4" class="tag"/>
  <text x="983" y="592" text-anchor="middle" class="lbl">调用 / 结果</text>
  <rect x="1040" y="561" width="200" height="78" rx="8" fill="#fff7ec" stroke="#e3a857" stroke-width="1.4"/>
  <text x="1140" y="585" text-anchor="middle" class="t">数据访问层</text>
  <text x="1140" y="605" text-anchor="middle" class="d">backend HTTP · observation</text>
  <text x="1140" y="624" text-anchor="middle" class="d">ExecutionEnv（四个基础工具）</text>

  <!-- 运行保障 -->
  <text x="24" y="720" fill="#1f2a3d" font-size="15" font-weight="700">运行保障（贯穿循环，由插件契约统一提供）</text>
  <g>
    <rect x="24" y="732" width="195" height="96" rx="8" class="node"/>
    <text x="40" y="758" class="t">状态</text>
    <text x="40" y="782" class="d">Pi 会话 SQLite 持久化</text>
    <text x="40" y="804" class="d">挂起状态写入会话（待做）</text>

    <rect x="231" y="732" width="195" height="96" rx="8" class="node todo"/>
    <text x="247" y="758" class="t">预算与成本</text>
    <text x="247" y="782" class="d">回合 · 时长 · token 上限</text>
    <text x="247" y="804" class="d">用尽注入收尾指令</text>

    <rect x="438" y="732" width="195" height="96" rx="8" class="node todo"/>
    <text x="454" y="758" class="t">校验</text>
    <text x="454" y="782" class="d">typebox 入参校验</text>
    <text x="454" y="804" class="d">领域校验进 tool_result</text>

    <rect x="645" y="732" width="195" height="96" rx="8" class="node todo"/>
    <text x="661" y="758" class="t">重试</text>
    <text x="661" y="782" class="d">模型请求 maxRetries</text>
    <text x="661" y="804" class="d">幂等读请求有限重试</text>

    <rect x="852" y="732" width="195" height="96" rx="8" class="node"/>
    <text x="868" y="758" class="t">错误处理</text>
    <text x="868" y="782" class="d">工具错误回给模型</text>
    <text x="868" y="804" class="d">不可恢复错误 terminate</text>

    <rect x="1059" y="732" width="197" height="96" rx="8" class="node todo"/>
    <text x="1075" y="758" class="t">可观测</text>
    <text x="1075" y="782" class="d">脱敏 SSE 事件流</text>
    <text x="1075" y="804" class="d">轨迹导出供评测</text>
  </g>

  <!-- 图例 -->
  <rect x="24" y="852" width="36" height="20" rx="4" class="node"/>
  <text x="68" y="867" class="d">已有</text>
  <rect x="120" y="852" width="36" height="20" rx="4" class="node todo"/>
  <text x="164" y="867" class="d">待做或需补齐</text>
  <text x="1256" y="867" text-anchor="end" class="d">对应 docs/brainstorms/20261001-01-agent-capability-refactor.zh-CN.md §4.0</text>
</svg>
