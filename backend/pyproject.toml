[project]
name = "glaux-backend"
version = "0.1.0"
description = "Glaux IDE 前端的 FastAPI 外壳——编排/IO/进程隔离的薄 HTTP 层，不含 TF"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    # science-core 的运行期依赖（读边界/测量/tiff→PNG）——纯计算，无 TF。
    "numpy>=1.24",
    "Pillow>=10.0",
]

# 说明：主进程刻意不依赖 TensorFlow / caroSegDeep。
# /segment 经隔离子进程（.venv-csd, py3.8/TF2.4）调用；science-core / orchestration
# 经 app/config.py 挂到 sys.path 接入（不改其打包），主进程只用其纯计算部分。

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "httpx>=0.27",  # TestClient
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
