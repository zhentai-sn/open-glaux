[project]
name = "glaux-backend"
version = "0.2.0"
description = "Glaux IDE 前端的 FastAPI 外壳——编排/IO/进程隔离的薄 HTTP 层，不含 TF"
# D12(2026-08-27 技术债审计):实际只在 3.12 上验证过,声明支持 3.10 是没有依据的承诺。
# 与 Makefile 的 `uv venv --python 3.12` 对齐。
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    # science-core 的运行期依赖（读边界/测量/tiff→PNG）——纯计算，无 TF。
    "numpy>=1.24",
    "Pillow>=10.0",
    # P6：CT NIfTI 读（voxel_spacing/labelmap patch）。数据 IO 库（非重模型，主进程允许）。
    "nibabel>=5.0",
    # 注意：不含任何 LLM SDK——与模型说话的唯一进程是 agent-runtime（退役 orchestration，2026-08-16）。
    # P7：病理 WSI 瓦片服务——OpenSlide 读 .svs/.ndpi + DeepZoom 出瓦片。数据 IO C 库
    # （同 nibabel，非重模型，主进程允许）；openslide-bin 是自带 libopenslide 的 wheel，免系统装。
    "openslide-python>=1.3",
    "openslide-bin>=4.0",
    # Atlas · 图谱（SDD 03）：案例表（嵌入式向量/全文库，进程内无服务）+ 教科书 PDF 抽图 +
    # 网页抽图。全部为数据 IO 库（非重模型，主进程允许）；VLM 描述仍由 agent-runtime 生成。
    "lancedb>=0.37",
    "pymupdf>=1.26",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "python-multipart>=0.0.9",  # /atlas/imports/pdf 文件上传
]

# 说明：主进程刻意不依赖 TensorFlow / caroSegDeep。
# /segment 经隔离子进程（.venv-csd, py3.8/TF2.4）调用；science-core
# 经 app/config.py 挂到 sys.path 接入（不改其打包），主进程只用其纯计算部分。

[project.optional-dependencies]
# SDD 10 D-19/D-23：video 模态的解复用与逐帧解码（PyAV 自带 FFmpeg 动态库）。可选：缺库时
# VideoSource.probe 为 False，video 模态不可用，其余模态不受影响。
video = [
    "av>=14.0",
]
dev = [
    "ruff>=0.4",
    "httpx>=0.27",
    "httpx2>=2.0.0",  # Starlette TestClient
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
