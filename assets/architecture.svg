<svg viewBox="0 0 680 640" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b8f9a"/>
    </marker>
  </defs>

  <!-- ── input ─────────────────────────────────────────────── -->
  <rect x="160" y="16" width="360" height="40" rx="20" fill="#8b8f9a" fill-opacity="0.10" stroke="#8b8f9a" stroke-width="1.2"/>
  <text x="340" y="41" text-anchor="middle" font-size="13.5" fill="#6b7280">Research goal in plain language  ·  any biomedical image</text>
  <line x1="340" y1="56" x2="340" y2="86" stroke="#8b8f9a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── agent (swappable engine) ──────────────────────────── -->
  <rect x="96" y="90" width="488" height="92" rx="14" fill="#6366f1" fill-opacity="0.08" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="340" y="118" text-anchor="middle" font-size="15.5" fill="#6366f1" font-weight="700">Agent</text>
  <text x="340" y="139" text-anchor="middle" font-size="12" fill="#6b7280">ships with the repo (agent-runtime · Node.js)  ·  or plug in any API / model</text>
  <text x="340" y="160" text-anchor="middle" font-size="12" fill="#6b7280">plan → act → verify → iterate  ·  acts through tools such as <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#6366f1">run_task</tspan></text>
  <line x1="340" y1="182" x2="340" y2="216" stroke="#8b8f9a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="203" font-size="10.5" fill="#8b8f9a">drives</text>

  <!-- ── Glaux environment ────────────────────────────────── -->
  <rect x="48" y="220" width="584" height="336" rx="16" fill="#8b5cf6" fill-opacity="0.05" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="340" y="248" text-anchor="middle" font-size="15.5" fill="#8b5cf6" font-weight="700">Glaux — the environment the agent works in</text>
  <text x="340" y="268" text-anchor="middle" font-size="11.5" fill="#6b7280">Web (React)  ·  REST backend (FastAPI)  ·  science-core (Python)  ·  models in isolated processes</text>

  <!-- layer 1: representation -->
  <rect x="68" y="286" width="544" height="54" rx="10" fill="#8b5cf6" fill-opacity="0.07" stroke="#8b5cf6" stroke-opacity="0.45" stroke-width="1"/>
  <rect x="80" y="298" width="112" height="30" rx="8" fill="#8b5cf6" fill-opacity="0.16"/>
  <text x="136" y="318" text-anchor="middle" font-size="12.5" fill="#8b5cf6" font-weight="700">Representation</text>
  <text x="206" y="309" font-size="12" fill="#6b7280">eyes — decode any modality into one computable representation</text>
  <text x="206" y="326" font-size="10.5" fill="#8b8f9a">ultrasound · CT · whole-slide pathology · microscopy</text>

  <!-- layer 2: action -->
  <rect x="68" y="350" width="544" height="54" rx="10" fill="#8b5cf6" fill-opacity="0.07" stroke="#8b5cf6" stroke-opacity="0.45" stroke-width="1"/>
  <rect x="80" y="362" width="112" height="30" rx="8" fill="#8b5cf6" fill-opacity="0.16"/>
  <text x="136" y="382" text-anchor="middle" font-size="12.5" fill="#8b5cf6" font-weight="700">Action</text>
  <text x="206" y="373" font-size="12" fill="#6b7280">hands — segment · measure · reconstruct, in real physical units</text>
  <text x="206" y="390" font-size="10.5" fill="#8b8f9a">one task registry defines what the environment can do; new tasks plug in</text>

  <!-- layer 3: verification -->
  <rect x="68" y="414" width="544" height="54" rx="10" fill="#8b5cf6" fill-opacity="0.07" stroke="#8b5cf6" stroke-opacity="0.45" stroke-width="1"/>
  <rect x="80" y="426" width="112" height="30" rx="8" fill="#8b5cf6" fill-opacity="0.16"/>
  <text x="136" y="446" text-anchor="middle" font-size="12.5" fill="#8b5cf6" font-weight="700">Verification</text>
  <text x="206" y="437" font-size="12" fill="#6b7280">referee — every result is checked, recorded, and can be re-run</text>
  <text x="206" y="454" font-size="10.5" fill="#8b8f9a">consistency checks · Dice / MAE · uncertainty · operation record</text>

  <!-- layer 4: memory -->
  <rect x="68" y="478" width="544" height="54" rx="10" fill="#8b5cf6" fill-opacity="0.07" stroke="#8b5cf6" stroke-opacity="0.45" stroke-width="1"/>
  <rect x="80" y="490" width="112" height="30" rx="8" fill="#8b5cf6" fill-opacity="0.16"/>
  <text x="136" y="510" text-anchor="middle" font-size="12.5" fill="#8b5cf6" font-weight="700">Memory</text>
  <text x="206" y="501" font-size="12" fill="#6b7280">experience — Atlas reference library · verified traces · corrections</text>
  <text x="206" y="518" font-size="10.5" fill="#8b8f9a">look up similar cases before acting; knowledge accumulates over time</text>

  <!-- ── output ────────────────────────────────────────────── -->
  <line x1="340" y1="556" x2="340" y2="586" stroke="#8b8f9a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="170" y="590" width="340" height="40" rx="20" fill="#8b8f9a" fill-opacity="0.10" stroke="#8b8f9a" stroke-width="1.2"/>
  <text x="340" y="615" text-anchor="middle" font-size="13.5" fill="#6b7280">Verified, reproducible insight  ·  with its record</text>
</svg>
